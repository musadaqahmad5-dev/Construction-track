      :root {

      html, body, #root {
        background-color: #05050a !important;

    <script>
      // 1. Storage Polyfill to prevent SecurityError DOMExceptions when running in sandboxed iframes
      (function() {
        function createMockStorage() {
          var store = {};
          var mock = {
            getItem: function(key) {
              return store.hasOwnProperty(key) ? store[key] : null;
            },
            setItem: function(key, value) {
              store[key] = String(value);
            },
            removeItem: function(key) {
              delete store[key];
            },
            clear: function() {
              store = {};
            },
            key: function(index) {
              var keys = Object.keys(store);
              return keys[index] || null;
            }
          };
          Object.defineProperty(mock, 'length', {
            get: function() {
              return Object.keys(store).length;
            },
            configurable: true
          });
          return mock;
        }

        try {
          var testKey = '__storage_test__';
          window.localStorage.setItem(testKey, testKey);
          window.localStorage.removeItem(testKey);
        } catch (e) {
          try {
            Object.defineProperty(window, 'localStorage', {
              value: createMockStorage(),
              configurable: true,
              writable: true
            });
          } catch (err) {}
        }

        try {
          var testKey = '__storage_test__';
          window.sessionStorage.setItem(testKey, testKey);
          window.sessionStorage.removeItem(testKey);
        } catch (e) {
          try {
            Object.defineProperty(window, 'sessionStorage', {
              value: createMockStorage(),
              configurable: true,
              writable: true
            });
          } catch (err) {}
        }

        // 2. Intercept and swallow benign internal Firestore stream assertions (ID: ca9 / ve:-1 / WebChannel aborts)
        function isFirestoreAssert(err) {
          if (!err) return false;
          var str = '';
          try {
            if (typeof err === 'string') str = err;
            else str = (err.message || '') + ' ' + (err.stack || '') + ' ' + (err.reason || '') + ' ' + JSON.stringify(err);
          } catch (_) {
            str = String(err);
          }
          var upper = str.toUpperCase();
          return upper.includes('CA9') ||
                 upper.includes('INTERNAL ASSERTION FAILED') ||
                 upper.includes('VE:-1') ||
                 upper.includes('UNEXPECTED STATE') ||
                 upper.includes('WATCHCHANGEAGGREGATOR') ||
                 upper.includes('PERSISTENTLISTENSTREAM');
        }

        window.addEventListener('error', function(event) {
          if (isFirestoreAssert(event.error) || isFirestoreAssert(event.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            console.warn('[Firestore stream assertion handled safely]:', event.message || event.error);
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isFirestoreAssert(event.reason) || isFirestoreAssert(event)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            console.warn('[Firestore stream rejection handled safely]:', event.reason);
          }
        }, true);
      })();
    </script>
